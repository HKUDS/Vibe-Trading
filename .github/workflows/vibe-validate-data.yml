# VIBE LAB — probe free data sources from a GitHub runner (open egress).
# The session sandbox gets 403s on market-data hosts (MEMORY.md I-V5); this
# workflow answers "which feeds actually work" from neutral infrastructure.
# Informational (fails only if ZERO sources respond). The push trigger (paths-
# filtered) exists because dispatch-only workflows outside the default branch
# are not indexed by GitHub — first push registers it AND runs the probe.
name: VIBE LAB validate data sources

on:
  workflow_dispatch:
  push:
    branches: [claude/vibe-trading-setup-w0m9fg]
    paths:
      - "scripts/probe_data_sources.py"
      - ".github/workflows/vibe-validate-data.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install probe deps (minimal, not the whole project)
        run: pip install -q yfinance ccxt requests

      - name: Probe data sources
        run: python scripts/probe_data_sources.py
