- bull_market_momentum
- high_volatility_regime
tuning_hints:
- 使用LLT版本替代EMA交叉：二阶低延迟滤波器可大幅改善收益
- LLT版本参数调优：调整滤波器截止频率以匹配当前市场周期
- 'EMA周期: 可尝试(10/50)或(20/60)减少交易频率'
- 加入通道确认：仅当突破通道上轨且EMA交叉时做多
- 加入波动率过滤：高波动时缩小仓位或暂停交易
