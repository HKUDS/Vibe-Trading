name: Low Latency Trendline EMA(5/20) (广发证券)
source: builtin
area: timing
description: 广发证券低延迟趋势线（LLT）择时策略，基于EMA(5)与EMA(20)交叉信号。当快线EMA(5)上穿慢线EMA(20)时做多，下穿时空仓。LLT版本（二阶低延迟滤波器）几乎完全复制了买入持有收益(21.06%
  vs 21.11%)，但波动率降低35%。基础EMA版本跑输基准(-12.9%超额)，交易频率过高(178笔)，胜率仅27.9%。回测标的：上证综指(000001.SH)。
effective_scenarios:
- mean_reversion
failure_scenarios:
