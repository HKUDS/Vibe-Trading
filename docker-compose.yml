services:
  vibe-trading:
    build: .
    ports:
      - "127.0.0.1:8899:8899"
    env_file:
      - agent/.env
    environment:
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
      - VIBE_TW_STOCK_DB=/data/tw-stock/latest.db
      # Ollama runs on the host; from inside the container "localhost" is the
      # container itself, so default to reaching the host via host.docker.internal.
      # Override by exporting OLLAMA_BASE_URL (or setting it in a top-level .env)
      # when Ollama runs elsewhere or on a different port.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Maps host.docker.internal -> host gateway (needed on Linux; harmless on Docker Desktop).
      # Requires Docker Engine >= 20.10 / Compose v2 (host-gateway support).
      - "host.docker.internal:host-gateway"
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      # User-level agent state: persistent memory, cross-session search index
      # (sessions.db), user-created skills, shadow accounts, hypothesis
      # registry, broker connector config, agent.json. Without this volume a
      # rebuild/recreate wipes it all (#197).
      - vibe-home:/home/vibe/.vibe-trading
      - vibe-swarm-runs:/app/agent/.swarm/runs
      - vibe-uploads:/app/agent/uploads
      # Persist Web-UI-driven agent/.env edits (_write_env_values in
      # src/api/helpers.py writes to /app/agent/.env) across container recreation.
      # env_file above still seeds the initial boot env from the same file.
      - ./agent/.env:/app/agent/.env
      # ------------------------------------------------------------------------
      # Local customization bind mounts (added 2026-08 by Alex).
      #
      # These paths are written directly into the image at build time, but a
      # full `docker compose build` is expensive (~45 min) and re-deploys would
      # silently drop them. Bind-mounting the host copies makes edits under
      # 伯克希尔/Vibe-Trading/agent/... take effect immediately on container
      # restart — no rebuild required.
      #
      # Customizations captured:
      #   1. agent/src/agent/context.py
      #      → system-prompt policy #7: explanatory/attribution analysis is
      #        allowed without forward-looking price evidence.
      #   2. agent/src/trading/types.py
      #      → READ_CAPABILITIES extended with 6 new broker_sdk capabilities.
      #   3. agent/src/trading/connectors/futu/{sdk.py,__init__.py}
      #      → 7 new read-only Futu API endpoints: get_rehab,
      #        get_capital_flow, get_capital_distribution, get_history_deals,
      #        get_acc_cash_flow, get_financials, get_earnings_calendar.
      #   4. agent/src/trading/service.py + agent/src/tools/trading_connector_tool.py
      #      → 7 service-layer wrappers + 7 BaseTool subclasses that surface the
      #        new SDK endpoints to the agent loop.
      #
      # If you intentionally want to revert a customization: remove the mount,
      # `docker compose restart vibe-trading`, and the baked-in image copy
      # reappears.
      # ------------------------------------------------------------------------
      - ./agent/src/agent/context.py:/app/agent/src/agent/context.py:ro
      - ./agent/src/trading/types.py:/app/agent/src/trading/types.py:ro
      - ./agent/src/trading/connectors/futu/sdk.py:/app/agent/src/trading/connectors/futu/sdk.py:ro
      - ./agent/src/trading/connectors/futu/__init__.py:/app/agent/src/trading/connectors/futu/__init__.py:ro
      - ./agent/src/trading/service.py:/app/agent/src/trading/service.py:ro
      - ./agent/src/tools/trading_connector_tool.py:/app/agent/src/tools/trading_connector_tool.py:ro
      - ./agent/src/agent/grounding.py:/app/agent/src/agent/grounding.py:ro
      # Broker-SDK bootstrap (added 2026-08 by Alex): installs optional broker
      # SDKs (futu-api, etc.) at container start. Idempotent — only installs
      # when the import is missing, so restarts are cheap.
      - ./scripts/install-broker-sdks.sh:/usr/local/bin/install-broker-sdks.sh:ro
      # Published Taiwan stock snapshots, mounted read-only. The default host
      # path stays OUTSIDE the checkout: no market data may ever land in the
      # working tree. Compose does not expand "~" in volume paths, so this uses
      # ${HOME}. Override VIBE_TW_STOCK_DATA_DIR in the root .env with another
      # absolute path outside the repo.
      - ${VIBE_TW_STOCK_DATA_DIR:-${HOME}/.vibe-trading/tw-stock}:/data/tw-stock:ro
    # --- Runtime hardening (VT-007) ---
    cap_drop:
      - ALL
    # SETUID/SETGID are kept on purpose: runner.py drops privilege to the
    # unprivileged vibe-sandbox user for LLM-generated-code subprocesses, which
    # needs setuid/setgid. They are granted from container start (not gained via
    # escalation), so no-new-privileges below does not neutralize them.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    # NOTE: read_only: true was removed to allow installing optional broker SDKs
    # (e.g. futu-api) at runtime. Production hardening (cap_drop, no-new-privileges,
    # SETUID/SETGID-only, mem/cpu/pids limits) is preserved.
    # Writable scratch remains on tmpfs; named volumes above still cover all
    # runtime app-data dirs.
    tmpfs:
      - /tmp
      - /home/vibe/.cache
      - /home/vibe/.config
    # Bound a single runaway backtest. Generous self-hosted defaults; override
    # in a compose override file for constrained hosts.
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    # Run the broker-SDK bootstrap before the server starts. Idempotent —
    # exits 0 immediately if the SDKs are already installed. The server itself
    # The Dockerfile sets USER vibe so the long-running server runs unprivileged.
    # But install-broker-sdks.sh needs root to write into /opt/venv. Force
    # `user: "0:0"` for the entrypoint command and let the entrypoint itself
    # drop to `vibe` before exec'ing the server.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "install-broker-sdks.sh && exec su -s /bin/sh vibe -c 'vibe-trading serve --host 0.0.0.0 --port 8899'"]
    restart: unless-stopped

  frontend:
    image: node:22@sha256:5647be709086c696ff32edaaf1c70cd26d1da6ab2b39c32f3c7b4c4a31957e37  # node:22 digest resolved 2026-07-28
    working_dir: /app
    ports:
      - "127.0.0.1:5899:5899"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-home:
  vibe-swarm-runs:
  vibe-uploads:
